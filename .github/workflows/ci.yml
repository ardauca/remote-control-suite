name: CI Build & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 1. Build Client PWA
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Client (Vite + TypeScript)
        run: |
          cd client
          npm run build

      # 2. Build Server Agent (.NET 9 Windows Forms & Kestrel)
      - name: Restore Server Dependencies
        run: dotnet restore server/RemoteAgent/RemoteAgent.csproj

      - name: Build Server (Release)
        run: dotnet build server/RemoteAgent/RemoteAgent.csproj -c Release --no-restore

      - name: Publish Server Agent
        run: dotnet publish server/RemoteAgent/RemoteAgent.csproj -c Release -o publish --no-build
